<header class="topbar">
  <div class="topbar__start">
    <button class="topbar__icon-btn" (click)="toggleSidebar.emit()" aria-label="تبديل القائمة الجانبية">
      <i class="pi pi-bars"></i>
    </button>
    <h1 class="topbar__title">{{ pageTitle() }}</h1>
  </div>

  <div class="topbar__end">
    <div class="topbar__notices-wrap" #noticeMenu>
      <button
        type="button"
        class="topbar__icon-btn topbar__icon-btn--border"
        (click)="toggleNotices()"
        [attr.aria-expanded]="noticesOpen()"
        aria-haspopup="menu"
        aria-label="الإشعارات"
      >
        <i class="pi pi-bell"></i>
        @if (unreadCount() > 0) {
          <span class="topbar__badge">{{ unreadCount() }}</span>
        }
      </button>

      @if (noticesOpen()) {
        <div class="topbar__notices" role="menu">
          <div class="topbar__notices-title">الإشعارات</div>
          @if (notifications().length === 0) {
            <p class="topbar__notices-empty">لا توجد إشعارات بعد.</p>
          } @else {
            <ul class="topbar__notices-list">
              @for (item of notifications(); track item.id) {
                <li>
                  <button
                    type="button"
                    class="topbar__notice"
                    [class.topbar__notice--unread]="item.readAt === null"
                    role="menuitem"
                    (click)="openNotification(item)"
                  >
                    <span class="topbar__notice-message">{{ item.body }}</span>
                    <span class="topbar__notice-age">{{ formatAge(item.createdAt) }}</span>
                  </button>
                </li>
              }
            </ul>
          }
        </div>
      }
    </div>

    <div class="topbar__user-wrap" #userMenu>
      <button
        type="button"
        class="topbar__user"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        aria-label="حساب المستخدم"
      >
        <span class="topbar__avatar">{{ avatarInitial() }}</span>
        <span class="topbar__username">{{ displayName() }}</span>
        <i class="pi pi-chevron-down topbar__chevron" [class.topbar__chevron--open]="menuOpen()"></i>
      </button>

      @if (menuOpen()) {
        <div class="topbar__menu" role="menu">
          <div class="topbar__menu-identity">
            <div class="topbar__menu-name">{{ displayName() }}</div>
            @if (email()) {
              <div class="topbar__menu-email"  >{{ email() }}</div>
            }
          </div>
          <button type="button" class="topbar__logout" role="menuitem" (click)="logout()">
            <i class="pi pi-sign-out" aria-hidden="true"></i>
            تسجيل الخروج
          </button>
        </div>
      }
    </div>
  </div>
</header>
