<p-toast position="top-left" key="ops">
  <ng-template let-message pTemplate="message">
    <button
      type="button"
      class="ops-toast-hit"
      (click)="notices.handleToastClick(message)"
    >
      <span class="ops-toast-hit__title">{{ message.summary }}</span>
      <span class="ops-toast-hit__body">{{ message.detail }}</span>
    </button>
  </ng-template>
</p-toast>

<div
  class="admin-layout"
  [class.admin-layout--collapsed]="!isMobile() && sidebarCollapsed()"
  [class.admin-layout--nav-open]="isMobile() && mobileNavOpen()"
>
  @if (isMobile() && mobileNavOpen()) {
    <div
      class="admin-layout__overlay"
      role="presentation"
      (click)="closeMobileNav()"
    ></div>
  }

  <aside
    class="admin-layout__sidebar"
    [attr.aria-hidden]="isMobile() && !mobileNavOpen() ? 'true' : null"
  >
    <ctrl-sidebar
      [collapsed]="!isMobile() && sidebarCollapsed()"
      [mobile]="isMobile()"
      (toggleCollapse)="toggleSidebar()"
      (navigate)="closeMobileNav()"
    />
  </aside>

  <div class="admin-layout__body">
    <header class="admin-layout__topbar">
      <ctrl-topbar (toggleSidebar)="toggleSidebar()" />
    </header>

    <main class="admin-layout__content">
      <router-outlet />
    </main>
  </div>
</div>
