<div class="zone-form">

  <div class="zone-form__header">
    <h2 class="zone-form__title">
      <i class="pi pi-map-marker"></i>
      تفاصيل المنطقة
    </h2>
    <p class="zone-form__subtitle">أدخل البيانات، ثم ارسم منطقة التغطية على الخريطة.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" class="zone-form__body">

    <!-- Zone Name -->
    <div class="zone-form__field">
      <label class="zone-form__label" for="zoneName">
        اسم المنطقة <span class="zone-form__required">*</span>
      </label>
      <input
        id="zoneName"
        type="text"
        pInputText
        formControlName="name"
        placeholder="مثال: مدينة نصر — القطاع 7"
        class="zone-form__input"
        [ngClass]="{ 'zone-form__input--invalid': invalid('name') }"
      />
      @if (invalid('name')) {
        <small class="zone-form__error">اسم المنطقة مطلوب (حرفان على الأقل).</small>
      }
    </div>

    <!-- City -->
    <div class="zone-form__field">
      <label class="zone-form__label" for="citySelect">
        المدينة <span class="zone-form__required">*</span>
      </label>
      <p-select
        inputId="citySelect"
        [options]="cityOptions"
        optionLabel="label"
        optionValue="value"
        formControlName="city"
        placeholder="اختر مدينة..."
        styleClass="zone-form__select"
      />
      @if (invalid('city')) {
        <small class="zone-form__error">يرجى اختيار مدينة.</small>
      }
    </div>

    <div class="zone-form__field">
      <label class="zone-form__label" for="minOrder">
        الحد الأدنى للطلب <span class="zone-form__required">*</span>
      </label>
      <p-inputnumber
        inputId="minOrder"
        formControlName="minOrder"
        [min]="0"
        mode="currency"
        currency="EGP"
        locale="ar-EG"
        styleClass="zone-form__number"
      />
    </div>

    <!-- Active / Inactive -->
    <div class="zone-form__field">
      <label class="zone-form__label">الحالة</label>
      <div class="zone-form__toggle-row">
        <p-toggleswitch formControlName="isActive" inputId="isActive" />
        <span
          class="zone-form__toggle-state"
          [ngClass]="form.controls.isActive.value
            ? 'zone-form__toggle-state--on'
            : 'zone-form__toggle-state--off'"
        >
          {{ form.controls.isActive.value ? 'نشط' : 'غير نشط' }}
        </span>
      </div>
    </div>

    <!-- Geometry requirement notice -->
    @if (!geometryReady()) {
      <div class="zone-form__notice">
        <i class="pi pi-info-circle"></i>
        ارسم مضلعاً على الخريطة لتفعيل الحفظ.
      </div>
    }

    <!-- Save -->
    <button
      type="submit"
      class="zone-form__btn zone-form__btn--primary"
      [disabled]="!geometryReady()"
    >
      <i class="pi pi-check"></i>
      حفظ المنطقة
    </button>

  </form>

</div>
