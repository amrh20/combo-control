<div class="flex min-h-screen items-center justify-center bg-gray-50 px-4 py-8" dir="rtl">
  <div class="w-full max-w-sm rounded-xl border border-gray-100 bg-white p-6 shadow-none">
    <div class="mb-5 text-center">
      <img src="/assets/images/logo.svg" alt="كومبو" width="112" height="40" class="mx-auto h-10 w-auto" />
      <p role="heading" aria-level="1" class="m-0 mt-4 text-[16px] font-semibold leading-snug text-[var(--Combo-text-text-display)]">
        تسجيل الدخول - إدارة العمليات
      </p>
    </div>

    @if (errorMessage(); as message) {
      <p class="m-0 mb-3 rounded-md bg-red-50 px-3 py-2 text-[12px] font-medium text-red-700" role="alert">
        {{ message }}
      </p>
    }

    <form class="flex flex-col gap-3" [formGroup]="form" (ngSubmit)="submit()">
      <label class="block">
        <span class="mb-1 block text-[11px] font-medium text-gray-700">
          البريد الإلكتروني <span class="text-red-600">*</span>
        </span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
           
          placeholder="name@combo.app"
          class="h-8 w-full rounded-md border border-gray-200 bg-white px-2.5 text-start text-[12px] text-gray-900 outline-none placeholder:text-gray-400 focus:border-[var(--Combo-border-border-primary)]"
          [class.border-red-400]="form.controls.email.touched && form.controls.email.invalid"
        />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="mt-1 block text-[11px] text-red-600">أدخل بريداً إلكترونياً صحيحاً.</span>
        }
      </label>

      <label class="block">
        <span class="mb-1 block text-[11px] font-medium text-gray-700">
          كلمة المرور <span class="text-red-600">*</span>
        </span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
           
          placeholder="••••••••"
          class="h-8 w-full rounded-md border border-gray-200 bg-white px-2.5 text-start text-[12px] text-gray-900 outline-none placeholder:text-gray-400 focus:border-[var(--Combo-border-border-primary)]"
          [class.border-red-400]="form.controls.password.touched && form.controls.password.invalid"
        />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="mt-1 block text-[11px] text-red-600">أدخل كلمة المرور.</span>
        }
      </label>

      <button
        type="submit"
        class="mt-1 inline-flex h-8 cursor-pointer items-center justify-center rounded-md border-0 bg-[var(--Combo-button-button-background-primary-default)] text-[12px] font-semibold text-[var(--Combo-text-text-oncolor-primary)] hover:bg-[var(--Combo-button-button-background-primary-hovered)] disabled:cursor-not-allowed disabled:opacity-60"
        [disabled]="submitting()"
      >
        {{ submitting() ? 'جارٍ الدخول...' : 'تسجيل الدخول' }}
      </button>
    </form>
  </div>
</div>
