<section class="mx-auto w-full max-w-2xl" dir="rtl">
  <article class="rounded-xl border border-red-500 bg-red-50 p-4 shadow-sm sm:p-6">
    <h1 class="m-0 text-[22px] font-bold leading-snug text-red-700">منطقة الخطر: مسح قاعدة البيانات</h1>

    <p class="mt-3 text-sm font-semibold leading-6 text-red-600">
      تحذير: هذا الإجراء لا يمكن التراجع عنه. سيُمسح كل الطلبات والكباتن والمحافظ والعمليات من قاعدة البيانات.
    </p>

    <form class="mt-6 space-y-4" (submit)="$event.preventDefault(); resetDatabase()">
      <label class="block text-sm font-medium text-red-900" for="erase-confirmation">
        اكتب العبارة
        <span class="font-mono font-bold" dir="ltr">{{ confirmationPhrase }}</span>
        للتأكيد
      </label>
      <input
        id="erase-confirmation"
        type="text"
        class="w-full rounded-lg border border-red-300 bg-white px-3 py-2 font-mono text-sm text-slate-900 outline-none ring-red-500 focus:ring-2 disabled:cursor-not-allowed disabled:bg-red-100"
        dir="ltr"
        autocomplete="off"
        spellcheck="false"
        [formControl]="confirm"
        [attr.placeholder]="confirmationPhrase"
        [disabled]="submitting()"
      />

      <button
        type="button"
        class="w-full rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 disabled:cursor-not-allowed disabled:bg-red-300 disabled:text-red-50 disabled:hover:bg-red-300 sm:w-auto"
        [disabled]="!canReset"
        (click)="resetDatabase()"
      >
        {{ submitting() ? 'جارٍ المسح…' : 'مسح قاعدة البيانات' }}
      </button>
    </form>
  </article>
</section>
